name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q asahi_fan_control
      - run: python -m pip install .
      - run: asahi-fan-control --demo --json
  gnome-transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gjs
      - run: python3 tools/build-extension.py
      - run: python3 -m zipfile -e dist/asahi-fan-control@l0nux.github.io.shell-extension.zip /tmp/asahi-extension-ci
      - run: gjs -m tests/test_transport.js /tmp/asahi-extension-ci/bridge.py
