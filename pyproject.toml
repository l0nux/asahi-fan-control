[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asahi-fan-control"
version = "0.4.0"
description = "English terminal dashboard with supervised control for Asahi Linux fans and temperatures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "l0nux"}]
dependencies = []

[project.scripts]
asahi-fan-control = "asahi_fan_control.__main__:main"

[tool.setuptools.packages.find]
include = ["asahi_fan_control*"]
